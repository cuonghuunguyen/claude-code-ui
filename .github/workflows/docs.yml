name: Docs

on:
  push:
    branches: [main]
    paths:
      - "docs/site/**"
      - "packages/web/src/shortcuts.ts"
      - "packages/web/src/leader.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  pull_request:
    paths:
      - "docs/site/**"
      - "packages/web/src/shortcuts.ts"
      - "packages/web/src/leader.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# One deploy at a time; a newer push replaces a queued one, but never cancels a running deploy.
concurrency:
  group: pages-${{ github.event_name == 'pull_request' && github.ref || 'main' }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Pull requests only check that the site builds (dead links fail it).
      - run: npm run docs:build
      # The docs live on Cloudflare (claudecodeui.cuonghuunguyen.app); GitHub Pages only redirects old
      # cuonghuunguyen.github.io/claude-code-ui/<path> links there, same path, so indexed URLs keep working.
      - if: github.event_name != 'pull_request'
        run: |
          mkdir -p redirect
          cat > redirect/404.html <<'HTML'
          <!doctype html><meta charset="utf-8"><title>Moved</title><meta name="robots" content="noindex">
          <script>location.replace("https://claudecodeui.cuonghuunguyen.app" + location.pathname.replace(/^\/claude-code-ui/, "") + location.search + location.hash)</script>
          <p>Moved to <a href="https://claudecodeui.cuonghuunguyen.app/">claudecodeui.cuonghuunguyen.app</a>.</p>
          HTML
          cp redirect/404.html redirect/index.html
      - if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5
      - if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: redirect

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
